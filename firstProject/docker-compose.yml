  services:
   web_service:
     build:
       context: ./
       dockerfile: ./dockerfiles/Dockerfile
     image: firstproject_web
     container_name: workshop2_web_container
     stdin_open: true #  docker attach container_id
     tty: true
     ports:
      - "8000:8000"
     volumes:
      - .:/root/workspace/site
   
   psql-db:
    image: 'postgres:14'
    container_name: psql-db2
    environment:
      - PGPASSWORD=123456
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=member_db
    ports:
      - '5446:5432'
    volumes:
      - db:/var/lib/postgresql/data

  volumes:
    db:
      driver: local